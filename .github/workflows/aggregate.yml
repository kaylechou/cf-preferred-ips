name: Aggregate preferred IPs
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate IPs
        run: python3 aggregate.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aggregated-ips.txt
          git diff --cached --quiet || git commit -m "chore: update aggregated-ips.txt" && git push
